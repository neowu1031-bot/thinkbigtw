<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{

.redirect-notice{padding:80px 0}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);border:1.5px solid var(--red);border-radius:4px;padding:4px 10px;margin-bottom:20px}

.plans-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:32px 0}

.plan-card{background:var(--gray);border:1.5px solid var(--gray2);border-radius:16px;padding:28px 24px}

.plan-card .plan-desc{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:20px}
.cta-btn{display:inline-block;background:var(--red);color:#fff;font-family:var(--tc);font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none;transition:background .2s}
.cta-btn:hover{background:#c73821;text-decoration:none}
.cta-btn.secondary{background:var(--ink)}
