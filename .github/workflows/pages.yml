name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build public site (publish only public files)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude '.claude/' --exclude '.claude-flow/' \
            --exclude '_site/' --exclude 'workers/' --exclude 'supabase/' --exclude 'scripts/' \
            --exclude 'data/' --exclude 'node_modules/' \
            --exclude '*.py' --exclude '*.sh' --exclude '*.zip' --exclude '*.patch' --exclude '*.mjs' --exclude '*.cjs' \
            --exclude '.gitignore' --exclude '_config.yml' --exclude '*.draft*.html' --exclude 'package*.json'
          test -f _site/index.html && test -f _site/CNAME && test -f _site/.well-known/security.txt
          ! test -e _site/workers && ! test -e _site/supabase && ! test -e _site/scripts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
