name: Scheduled publish

# 定時上線：把 publish/<UTC時間>-<slug> 分支在指定時間合進 main，再觸發 Pages 部署。
# 分支命名：publish/YYYYMMDDTHHMMZ-<slug>（UTC），例：publish/20261005T1200Z-gpu-check
# 注意：GitHub 排程可能延遲 5–30 分鐘。

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Merge due publish branches
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_EDITOR=true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          now=$(date -u +%Y%m%dT%H%MZ)
          echo "Now (UTC): ${now}" >> "$GITHUB_STEP_SUMMARY"
          published=0
          AGGREGATE_FILES="en/qa/index.html library/qa/index.html llms.txt sitemap-qa.xml en/news/index.html library/news/index.html llms-full.txt sitemap.xml"
          branches=$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/publish/' | sort)
          for b in $branches; do
            name=${b#publish/}
            when=${name%%-*}
            if ! [[ "${when}" =~ ^[0-9]{8}T[0-9]{4}Z$ ]]; then
              echo "- skip \`${b}\`：名稱格式不符" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [[ "${when}" > "${now}" ]]; then
              echo "- wait \`${b}\`（排定 ${when}）" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git checkout -q -B work "origin/${b}"

            REBASE_OK=false
            CONFLICT_BRANCH=false
            MAX_ROUNDS=30
            round=0
            while [ $round -lt $MAX_ROUNDS ]; do
              round=$((round+1))
              if [ $round -eq 1 ]; then
                if git rebase -q main 2>/dev/null; then REBASE_OK=true; break; fi
              else
                if git rebase --continue 2>/dev/null; then REBASE_OK=true; break; fi
              fi

              CONFLICTS=$(git ls-files -u --format='%(path)' | sort -u | tr '\n' ' ')
              if [ -z "$CONFLICTS" ]; then
                if git rebase --continue 2>/dev/null; then REBASE_OK=true; fi
                break
              fi

              all_agg=true
              for cf in $CONFLICTS; do
                is_agg=false
                for af in $AGGREGATE_FILES; do
                  [ "$cf" = "$af" ] && is_agg=true && break
                done
                $is_agg || { all_agg=false; break; }
              done

              if ! $all_agg; then
                git rebase --abort 2>/dev/null || true
                CONFLICT_BRANCH=true
                break
              fi

              if ! python3 .github/scripts/resolve-aggregate.py; then
                git rebase --abort 2>/dev/null || true
                CONFLICT_BRANCH=true
                break
              fi
            done

            if $CONFLICT_BRANCH || ! $REBASE_OK; then
              git rebase --abort 2>/dev/null || true
              git checkout -q main
              title="Scheduled publish conflict: ${b}"
              if ! gh issue list --state open --limit 100 --json title --jq '.[].title' | grep -qxF "${title}"; then
                gh issue create \
                  --title "${title}" \
                  --body "分支 \`${b}\` 排定 ${when} 上線，但與 main 衝突，未發布。請手動 rebase 後重推。" || true
              fi
              echo "- conflict \`${b}\`：已開 issue（若無既有同名 open issue），未發布" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            git checkout -q main
            git merge -q --ff-only work
            git push origin main
            git push origin --delete "${b}"
            echo "- published \`${b}\` → main $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
            published=$((published + 1))
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推的 commit 不會觸發 push 事件，但可以觸發 workflow_dispatch
      - name: Trigger Pages deploy
        if: steps.merge.outputs.published != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main
          echo "Pages deploy triggered" >> "$GITHUB_STEP_SUMMARY"
