name: ThinkBIG Smoke Test

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site - root index
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://thinkbigtw.com/)
          if [ "$code" != "200" ]; then echo "thinkbigtw.com/ returned $code"; exit 1; fi
      - name: Site - puig page
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://thinkbigtw.com/puig/)
          if [ "$code" != "200" ]; then echo "thinkbigtw.com/puig/ returned $code"; exit 1; fi
      - name: Worker - /health
        run: curl -fsS https://moneyradar-ai-proxy.thinkbigtw.workers.dev/health | grep -q '"ok":true'
      - name: Worker - /quote ASML.AS
        run: curl -fsS 'https://moneyradar-ai-proxy.thinkbigtw.workers.dev/quote?symbol=ASML.AS' | grep -q '"price"'
      - name: Worker - /quote BHP.AX
        run: curl -fsS 'https://moneyradar-ai-proxy.thinkbigtw.workers.dev/quote?symbol=BHP.AX' | grep -q '"price"'
      - name: Worker - /chat
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hi"}]}' \
            https://moneyradar-ai-proxy.thinkbigtw.workers.dev/chat | grep -q '"reply"'
