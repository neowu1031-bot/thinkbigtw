name: Deploy Headers Injector Worker

on:
  push:
    branches: ["main"]
    paths:
      - "workers/headers-injector/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy thinkbigtw-headers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy Worker
        working-directory: ./workers/headers-injector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --keep-vars
        # --keep-vars: route update may fail (token lacks Zone:Workers Routes permission)
        # but script upload succeeds; existing route thinkbigtw.com/* stays pointed at
        # thinkbigtw-headers, so new code goes live regardless.
