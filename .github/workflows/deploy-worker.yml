name: Deploy AI Proxy Worker

on:
  push:
    branches: ["main"]
    paths:
      - "workers/ai-proxy/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy moneyradar-ai-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler@4

      # MINIMAX_API_KEY 已存在 Worker secret 中；輪替金鑰時手動執行
      # `wrangler secret put MINIMAX_API_KEY`，不在 CI 內做——GitHub secret
      # 未設時這步會把空值蓋掉線上金鑰
      - name: Deploy Worker
        working-directory: ./workers/ai-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
