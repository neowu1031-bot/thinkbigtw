name: Deploy AI Proxy Worker

on:
  push:
    branches: ["main"]
    paths:
      - "workers/ai-proxy/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy moneyradar-ai-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@4

      # 2026-11-13 起 AI 只走 Workers AI 非中國模型（workers/ai-proxy/src/ai-models.js），
      # 程式已不讀 MINIMAX_API_KEY；線上舊 secret 於上線確認後手動
      # `wrangler secret delete MINIMAX_API_KEY` 移除，不在 CI 內做
      - name: Deploy Worker
        working-directory: ./workers/ai-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
