<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PUIG 朋朋們 — Think BIG</title>
<meta name="description" content="Think BIG 朋朋交流會議室">
<link rel="icon" href="/images/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Azeret+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --gray:#f4f2f3; --ink:#1a1a1a; --pink:#f8c8d8; --red:#e8422a;
  --gold:#c9a24b; --dim:#8a8a8a; --line:#e8e6e7; --r:14px;
  --mono:"Azeret Mono",ui-monospace,Menlo,monospace;
  --tc:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--tc);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.14em;white-space:nowrap}
.logo b{color:var(--red)}
.hsub{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:.14em;margin-top:1px;font-weight:700}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.live i{width:8px;height:8px;border-radius:50%;background:#21c063;animation:blink 1.6s infinite}
.live.err i{background:var(--red);animation:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.hero{max-width:560px;margin:16px auto 0;padding:0 18px;width:100%}
.herocard{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 4px 20px rgba(232,66,42,.08)}
.herocard img{display:block;width:100%;height:auto}
.herosub{text-align:center;font-size:12.5px;color:#666;margin-top:9px}
.herosub b{color:var(--red)}

.feed{max-width:860px;margin:0 auto;padding:16px 18px 128px;width:100%;flex:1}
.day{display:flex;align-items:center;gap:12px;margin:18px 0 10px;color:var(--dim);font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:11px;margin:14px 0;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ava{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;color:#fff;letter-spacing:.02em}
.mbody{min-width:0;flex:1}
.mhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.mname{font-weight:700;font-size:13.5px}
.official{font-family:var(--mono);font-size:9px;background:var(--ink);color:#fff;padding:1px 6px;border-radius:4px;letter-spacing:.05em}
.mtime{font-family:var(--mono);font-size:10px;color:var(--dim)}
.bubble{margin-top:4px;background:var(--gray);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:14.5px;word-break:break-word;white-space:pre-wrap;width:fit-content;max-width:100%}
.msg.me .bubble{background:var(--pink)}
.att{margin-top:6px;max-width:min(320px,80vw)}
.att img{max-width:100%;border-radius:10px;display:block;cursor:pointer}
.att video{max-width:100%;border-radius:10px;display:block}
.att a.file{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);font-size:13.5px}
.att a.file .ic{font-size:22px}
.att a.file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--dim);text-align:center;padding:60px 0;font-size:13.5px}
.empty .m{font-size:34px;display:block;margin-bottom:8px}

.composer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.cwrap{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.cwrap textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;font:14.5px/1.5 var(--tc);resize:none;max-height:110px;outline:none;background:#fff}
.cwrap textarea:focus{border-color:var(--ink)}
.send{border:none;border-radius:12px;background:var(--red);color:#fff;font-family:var(--tc);font-weight:700;font-size:14px;padding:11px 20px;cursor:pointer;letter-spacing:.05em;flex:none}
.send:disabled{background:#ddd;cursor:not-allowed}
.as{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center;max-width:860px;margin:6px auto 0;letter-spacing:.05em}
.as b{color:var(--ink)} .as a{color:var(--red);cursor:pointer;text-decoration:underline}
@media (max-width:640px){.mascot{width:40%;background-position:50% 12%;background-size:230%}.feed{padding-bottom:138px}}

/* ── 助理團狀態列:手機=hero 下方橫排;寬螢幕=右側固定卡片 ── */
.agents{max-width:560px;margin:10px auto 0;padding:0 18px;width:100%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.agtitle{display:none}
.agchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.agava{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;flex:none}
.agname{font-size:12px;font-weight:700;white-space:nowrap}
.agst{color:var(--dim);font-family:var(--mono);font-size:10px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.agdot{width:7px;height:7px;border-radius:50%;flex:none;background:#21c063}
.agdot.queued{background:#e6b800}
.agdot.working{background:#ff8c1a;animation:blink 1.1s infinite}
.agdot.off{background:#bbb;animation:none}
.agoffline{max-width:560px;margin:10px auto 0;padding:8px 14px;width:calc(100% - 36px);display:none;background:#fff4f2;border:1px solid #f3c4bc;border-radius:10px;color:var(--red);font-size:12.5px;text-align:center}
.agoffline.show{display:block}
@media (min-width:1150px){
  .agents{position:fixed;right:22px;top:96px;width:200px;flex-direction:column;align-items:stretch;margin:0;padding:14px;gap:9px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 20px rgba(0,0,0,.05)}
  .agtitle{display:block;font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.14em;font-weight:700;margin-bottom:2px}
  .agchip{border:none;box-shadow:none;padding:2px 0;border-radius:0}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div><div class="logo">THINK<b>BIG</b></div><div class="hsub">PUIG 朋朋們 · 交流室</div></div>
    <div class="live" id="live"><i></i><span id="livetxt">LIVE</span></div>
  </div>
</header>

<div class="hero">
  <div class="herocard"><img src="/assets/puig-hero.jpg" alt="PUIG 朋朋們" loading="eager"></div>
  <div class="herosub">朋朋專屬 · 你的 <b>私人 AI 助理團</b> — 工作上有任何需要，直接問</div>
</div>

<div class="agents" id="agents"></div>
<div class="agoffline" id="agoffline">😴 助理團暫時離線，留言會保留，恢復上線後會立刻處理。</div>

<main class="feed" id="feed"><div class="empty"><span class="m">🦞</span>載入中…</div></main>

<div class="composer">
  <div class="cwrap">
    <button class="send" id="attach" style="background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:11px 14px" title="上傳檔案 / 影片 / 圖片">📎</button>
    <input type="file" id="file" hidden accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">
    <textarea id="input" rows="1" placeholder="以朋朋身分留言…"></textarea>
    <button class="send" id="send">送出</button>
  </div>
  <div class="as" id="upnote" style="display:none;color:var(--red)"></div>
  <div class="as">您的稱呼：<b id="who">—</b> · <a id="rename">更改</a> · 可傳圖片/影片/檔案（單檔上限 50MB）· 團隊通常幾分鐘內回覆</div>
</div>

<script>
const URL_ = "https://lfcmkpansxprugilyxvj.supabase.co/rest/v1/puig_messages";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmY21rcGFuc3hwcnVnaWx5eHZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTc5MDksImV4cCI6MjEwMDI3MzkwOX0.1kwUXMjJXoypf1x4ZtLowGLREunsjENvN5wRxAl-CFM";
const H = {"apikey": KEY, "Authorization": "Bearer " + KEY};

const WHO = {
  "claude-code":{label:"Claude Code", tag:"CC", c:"#d97757", official:true},
  "nini":       {label:"尼尼",         tag:"尼", c:"#e8422a", official:true},
  "hermes":     {label:"歐歐",         tag:"歐", c:"#7c5cff", official:true},
  "秘書處":      {label:"秘書處",       tag:"秘", c:"#b09aa4", official:true},
};
function who(sender){
  if(WHO[sender]) return WHO[sender];
  if(sender && sender.startsWith("guest:")){
    const nm = sender.slice(6) || "朋朋";
    return {label:nm, tag:nm.slice(0,2), c:"#4a6fa5", official:false};
  }
  return {label:sender||"?", tag:"?", c:"#8a8a8a", official:false};
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STORAGE = "https://lfcmkpansxprugilyxvj.supabase.co/storage/v1/object";
const BUCKET = "puig-files";

// 附件用 [[file:kind|url|name]] 存在訊息內文;render 時抽出來變成圖片/影片/檔案卡
function splitAttach(content){
  const re = /\[\[file:(image|video|file)\|([^|]+)\|([^\]]*)\]\]/g;
  let text = content, atts = [], m;
  while((m = re.exec(content))){ atts.push({kind:m[1], url:m[2], name:m[3]}); }
  text = content.replace(re, "").trim();
  return {text, atts};
}
function attHtml(atts){
  return atts.map(a => {
    if(a.kind==="image") return '<div class="att"><img src="'+esc(a.url)+'" loading="lazy" onclick="window.open(this.src)"></div>';
    if(a.kind==="video") return '<div class="att"><video src="'+esc(a.url)+'" controls playsinline></video></div>';
    const ic = /\.pdf$/i.test(a.name)?"📄":/\.(xls|xlsx|csv)$/i.test(a.name)?"📊":/\.(zip|rar|7z)$/i.test(a.name)?"🗜️":"📎";
    return '<div class="att"><a class="file" href="'+esc(a.url)+'" target="_blank" rel="noopener"><span class="ic">'+ic+'</span><span class="fn">'+esc(a.name||"檔案")+'</span></a></div>';
  }).join("");
}
const fmtTime = iso => new Date(iso).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"});
function fmtDay(iso){const d=new Date(iso),t=new Date();const same=(a,b)=>a.toDateString()===b.toDateString();if(same(d,t))return"今天";const y=new Date(Date.now()-864e5);if(same(d,y))return"昨天";return d.toLocaleDateString("zh-TW",{month:"numeric",day:"numeric",weekday:"short"});}

let myName = localStorage.getItem("puig_name") || "";
let mySender = () => "guest:" + myName;
let lastKey = "", timer = null;

function askName(force){
  let n = force ? "" : myName;
  while(!n || !n.trim()){
    n = (prompt("歡迎來到 PUIG 朋朋們！請輸入您的稱呼（其他人會看到）：", myName || "") || "").trim();
    if(n === null) return;
    if(n.length > 20) n = n.slice(0,20);
  }
  myName = n.replace(/[:：]/g,"·");
  localStorage.setItem("puig_name", myName);
  $("who").textContent = myName;
}

async function api(qs, opts={}){
  const r = await fetch(URL_ + qs, {...opts, headers:{...H, ...(opts.headers||{})}});
  if(!r.ok) throw new Error("HTTP " + r.status);
  return (r.status===201||r.status===204) ? null : r.json();
}

function render(rows){
  const feed = $("feed");
  if(!rows.length){ feed.innerHTML = '<div class="empty"><span class="m">🦞</span>還沒有留言，成為第一個發問的朋朋吧！</div>'; return; }
  const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 220;
  let html="", lastDay="";
  for(const m of rows){
    const day = fmtDay(m.created_at);
    if(day!==lastDay){ html+='<div class="day">'+day+'</div>'; lastDay=day; }
    const w = who(m.sender), mine = m.sender === mySender();
    const {text, atts} = splitAttach(m.content);
    const bubble = (text ? '<div class="bubble">'+esc(text)+'</div>' : '') + attHtml(atts);
    html += '<div class="msg '+(mine?"me":"")+'">'+
      '<div class="ava" style="background:'+w.c+'">'+esc(w.tag)+'</div>'+
      '<div class="mbody"><div class="mhead"><span class="mname">'+esc(w.label)+'</span>'+
      (w.official?'<span class="official">團隊</span>':'')+
      '<span class="mtime">'+fmtTime(m.created_at)+'</span></div>'+
      bubble+'</div></div>';
  }
  feed.innerHTML = html;
  if(nearBottom || !feed.dataset.loaded) window.scrollTo({top:document.body.scrollHeight});
  feed.dataset.loaded = "1";
}

async function refresh(){
  try{
    const newest = await api("?select=*&thread_id=eq.main&order=created_at.desc&limit=150");
    const rows = newest.reverse();
    $("live").classList.remove("err"); $("livetxt").textContent="LIVE";
    const key = rows.length ? rows[rows.length-1].id+rows.length : "0";
    if(key!==lastKey){ lastKey=key; render(rows); }
  }catch(e){ $("live").classList.add("err"); $("livetxt").textContent="離線"; }
  refreshAgents();
}

// ── 助理團狀態列 ──
const STATUS_URL = "https://lfcmkpansxprugilyxvj.supabase.co/rest/v1/puig_agent_status";
const AGENTS = ["claude-code","nini","hermes"];
const STMAP = {idle:["","待命"], queued:["queued","排隊中"], working:["working","作業中"], done:["","已回覆"], error:["off","異常"]};
function agElapsed(iso){
  const m = Math.floor((Date.now() - new Date(iso).getTime())/60000);
  return m >= 1 ? " "+(m>=60?Math.floor(m/60)+"h":m+"m") : "";
}
async function refreshAgents(){
  try{
    const r = await fetch(STATUS_URL+"?select=agent,status,detail,updated_at", {headers:H});
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    const by = {}; rows.forEach(x => by[x.agent]=x);
    const hb = by["concierge"];
    const online = hb && (Date.now() - new Date(hb.updated_at).getTime()) < 45000;
    $("agoffline").classList.toggle("show", !online);
    let html = '<div class="agtitle">助理團狀態</div>';
    for(const a of AGENTS){
      const w = WHO[a], s = by[a] || {status:"idle", updated_at:new Date().toISOString()};
      let cls, txt;
      if(!online){ cls="off"; txt="離線"; }
      else{
        const st = STMAP[s.status] || STMAP.idle;
        cls = st[0]; txt = st[1];
        if(s.status==="working") txt += agElapsed(s.updated_at)+"…";
        if(s.status==="done" && (Date.now()-new Date(s.updated_at).getTime()) > 600000){ txt="待命"; }
      }
      html += '<div class="agchip"><span class="agava" style="background:'+w.c+'">'+w.tag+'</span>'+
        '<span class="agname">'+w.label+'</span>'+
        '<span class="agst"><span class="agdot '+cls+'"></span>'+txt+'</span></div>';
    }
    $("agents").innerHTML = html;
  }catch(e){ /* 狀態列失敗不影響聊天 */ }
}

async function post(){
  const t = $("input").value.trim();
  if(!t) return;
  if(!myName){ askName(false); if(!myName) return; }
  $("send").disabled = true;
  try{
    await api("", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({sender: mySender(), content: t, thread_id:"main"})});
    $("input").value=""; $("input").style.height="auto";
    await refresh();
  }catch(e){ alert("送出失敗，請重試（"+e.message+"）"); }
  $("send").disabled=false; $("input").focus();
}

async function uploadFile(f){
  if(f.size > 52428800){ return alert("檔案超過 50MB 上限，請壓縮或用雲端連結分享。"); }
  if(!myName){ askName(false); if(!myName) return; }
  const kind = f.type.startsWith("image/") ? "image" : f.type.startsWith("video/") ? "video" : "file";
  const safe = f.name.replace(/[^\w.\-]/g,"_");
  const path = "u/" + Date.now() + "-" + Math.random().toString(36).slice(2,7) + "-" + safe;
  const note = $("upnote"); note.style.display="block"; note.textContent = "上傳中… "+f.name;
  $("attach").disabled = true; $("send").disabled = true;
  try{
    const r = await fetch(STORAGE + "/" + BUCKET + "/" + path, {
      method:"POST", headers:{...H, "Content-Type": f.type || "application/octet-stream"}, body: f });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const url = "https://lfcmkpansxprugilyxvj.supabase.co/storage/v1/object/public/" + BUCKET + "/" + path;
    const caption = $("input").value.trim();
    const content = (caption ? caption + "\n" : "") + "[[file:"+kind+"|"+url+"|"+f.name+"]]";
    await api("", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({sender: mySender(), content, thread_id:"main"})});
    $("input").value=""; $("input").style.height="auto"; note.style.display="none";
    await refresh();
  }catch(e){ note.textContent = "上傳失敗："+e.message; }
  $("attach").disabled = false; $("send").disabled = false;
}

$("attach").onclick = () => $("file").click();
$("file").onchange = e => { if(e.target.files[0]) uploadFile(e.target.files[0]); e.target.value=""; };
$("send").onclick = post;
$("rename").onclick = () => askName(true);
$("input").addEventListener("keydown", e => { if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();post();} });
$("input").addEventListener("input", function(){ this.style.height="auto"; this.style.height=Math.min(this.scrollHeight,110)+"px"; });

if(!myName) askName(false); else $("who").textContent = myName;
refresh();
timer = setInterval(refresh, 5000);
document.addEventListener("visibilitychange", () => {
  if(document.hidden){ clearInterval(timer); }
  else { refresh(); timer = setInterval(refresh, 5000); }
});
</script>
</body>
</html>
