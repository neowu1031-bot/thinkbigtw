// ══ CENTRAL STATE ══
function useStore() {
  const [orders, setOrders] = useState(initOrders);
  const [inv, setInv] = useState(initInv);
  const [toasts, setToasts] = useState([]);
  const toast = (msg, type = "info") => {
    const id = Date.now();
    setToasts(p => [...p, {
      id,
      msg,
      type
    }]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3000);
  };
  const addOrder = o => {
    const nid = `ORD-${4892 + orders.length + 1}`;
    setOrders(p => [{
      ...o,
      id: nid,
      dt: new Date().toISOString().slice(0, 10)
    }, ...p]);
    toast("訂單已建立！", "success");
  };
  const updateStatus = (id, st) => {
    setOrders(p => p.map(o => o.id === id ? {
      ...o,
      st
    } : o));
    toast(`${id} → ${st === "completed" ? "已完成" : st === "shipping" ? "出貨中" : "處理中"}`, "success");
  };
  const updateStock = (sku, delta) => {
    setInv(p => p.map(i => {
      if (i.sku !== sku) return i;
      const ns = i.stock + delta;
      return {
        ...i,
        stock: ns,
        st: ns <= i.reorder * 0.5 ? "critical" : ns <= i.reorder ? "low" : "ok"
      };
    }));
    toast(`${sku} 庫存 ${delta > 0 ? "+" : ""}${delta}`, "success");
  };
  return {
    orders,
    inv,
    toasts,
    toast,
    addOrder,
    updateStatus,
    updateStock
  };
}
