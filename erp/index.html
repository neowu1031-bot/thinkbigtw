// ══ CENTRAL STATE ══
function useStore(){
  const[orders,setOrders]=useState(initOrders);
  const[inv,setInv]=useState(initInv);
  const[toasts,setToasts]=useState([]);
  const toast=(msg,type="info")=>{const id=Date.now();setToasts(p=>[...p,{id,msg,type}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);};
  const addOrder=(o)=>{const nid=`ORD-${4892+orders.length+1}`;setOrders(p=>[{...o,id:nid,dt:new Date().toISOString().slice(0,10)},...p]);toast("訂單已建立！","success");};
  const updateStatus=(id,st)=>{setOrders(p=>p.map(o=>o.id===id?{...o,st}:o));toast(`${id} → ${st==="completed"?"已完成":st==="shipping"?"出貨中":"處理中"}`,"success");};
  const updateStock=(sku,delta)=>{setInv(p=>p.map(i=>{if(i.sku!==sku)return i;const ns=i.stock+delta;return{...i,stock:ns,st:ns<=i.reorder*0.5?"critical":ns<=i.reorder?"low":"ok"};}));toast(`${sku} 庫存 ${delta>0?"+":""}${delta}`,"success");};
  return{orders,inv,toasts,toast,addOrder,updateStatus,updateStock};
}

// ══ INVENTORY PAGE ══
function PgInv({S}){
  const[view,setView]=useState("all");

  return<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>

      <div style={{display:"flex",gap:6}}><div style={{display:"flex",alignItems:"center",gap:4,padding:"5px 8px",background:T.bg,borderRadius:6,border:`1px solid ${T.b}`,width:150}}>{$.srch({s:12,c:T.tm})}<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="搜尋..." style={{border:"none",background:"none",outline:"none",fontSize:11,color:T.t,width:"100%"}}/></div><Btn small>{$.dl({s:11,c:T.ts})} 匯出</Btn></div>
    </div>
    <Card s={{padding:0,overflow:"hidden",marginBottom:14}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr style={{background:T.bg}}><Th>SKU</Th><Th>品名</Th><Th>分類</Th><Th>庫存</Th><Th>水位</Th><Th>成本</Th><Th>價值</Th><Th>儲位</Th><Th>狀態</Th><Th>操作</Th></tr></thead><tbody>{list.map(i=><tr key={i.sku} style={{borderBottom:`1px solid ${T.bl}`,background:i.st==="critical"?T.rbg:i.st==="low"?T.abg:""}}><Td mono c={T.ts}>{i.sku}</Td><Td bold>{i.name}</Td><Td c={T.ts}>{i.cat}</Td><Td mono bold c={i.st==="critical"?"#ef4444":i.st==="low"?T.am:T.t}>{i.stock.toLocaleString()}</Td><Td mono c={T.tm}>{i.reorder.toLocaleString()}</Td><Td mono>{fmtF(i.cost)}</Td><Td mono bold>{fmt(i.stock*i.cost)}</Td><Td mono c={T.ts}>{i.loc}</Td><Td><Badge s={i.st}/></Td><Td><Btn small onClick={()=>{setAdj(i.sku);setAQ(0);}}>調整</Btn></Td></tr>)}</tbody></table></Card>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Card><Sec title="庫存價值" en="By Category"/><ResponsiveContainer width="100%" height={160}><BarChart data={["電子","材料","機械","工具"].map(c=>({c,v:S.inv.filter(i=>i.cat===c).reduce((s,i)=>s+i.stock*i.cost,0)/1e6}))}><CartesianGrid strokeDasharray="3 3" stroke={T.bl}/><XAxis dataKey="c" tick={{fill:T.tm,fontSize:10}} axisLine={{stroke:T.b}}/><YAxis tick={{fill:T.tm,fontSize:10}} axisLine={{stroke:T.b}} tickFormatter={v=>`${v.toFixed(0)}M`}/><Tooltip/><Bar dataKey="v" fill={T.bl2} radius={[4,4,0,0]}/></BarChart></ResponsiveContainer></Card>
      <Card><Sec title="AI補貨建議" en="Auto Reorder"/>{S.inv.filter(i=>i.st!=="ok").length===0?<div style={{textAlign:"center",padding:16,color:T.tm,fontSize:12}}>✅ 無需補貨</div>:S.inv.filter(i=>i.st!=="ok").map((i,idx)=><div key={idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${T.bl}`}}><div><div style={{fontSize:12,fontWeight:500}}>{i.name}</div><div style={{fontSize:11,color:T.ts}}>補 <b style={{color:T.r}}>{(i.reorder-i.stock+Math.round(i.reorder*0.2)).toLocaleString()}</b></div></div><Btn small primary onClick={()=>S.updateStock(i.sku,i.reorder-i.stock+Math.round(i.reorder*0.2))}>補貨</Btn></div>)}</Card>
    </div>
    <Modal open={!!adjSku} onClose={()=>setAdj(null)} title={`庫存調整 ${adjSku}`}><div><div style={{fontSize:12,marginBottom:10}}>目前：<b>{S.inv.find(i=>i.sku===adjSku)?.stock.toLocaleString()}</b></div><Input label="調整量（+進貨 -出貨）" type="number" value={adjQty} onChange={v=>setAQ(+v)} mono/><div style={{display:"flex",gap:6,justifyContent:"flex-end",marginTop:10}}><Btn onClick={()=>setAdj(null)}>取消</Btn><Btn primary onClick={()=>{if(adjQty!==0)S.updateStock(adjSku,adjQty);setAdj(null);}}>確認</Btn></div></div></Modal>
  </>;
}

    {id:"inventory",icon:$.box,l:"庫存管理",en:"Inventory"},
    {id:"finance",icon:$.dol,l:"財務會計",en:"Finance"},
    {id:"procurement",icon:$.clip,l:"採購/供應鏈",en:"Procurement"},
    {id:"manufacturing",icon:$.tool,l:"生產製造",en:"Manufacturing"},
    {id:"crm",icon:$.heart,l:"客戶關係",en:"CRM"},
    {id:"hr",icon:$.usr,l:"人力資源",en:"HR"},
    {id:"projects",icon:$.chk,l:"專案管理",en:"Projects"},
    {id:"analytics",icon:$.bar,l:"商業智慧",en:"Analytics"},
    {id:"settings",icon:$.gear,l:"系統設定",en:"Settings"},
  ];

  const pages={dashboard:<PgDash S={S} goTo={setTab}/>,orders:<PgOrders S={S}/>,inventory:<PgInv S={S}/>,finance:<PgFinance/>,procurement:<PgProcure S={S}/>,manufacturing:<PgMfg/>,crm:<PgCRM S={S}/>,hr:<PgHR/>,projects:<PgProjects/>,analytics:<PgAnalytics/>,settings:<PgSettings/>};

  const sendAi=()=>{if(!aiIn.trim())return;const q=aiIn.trim();setMsgs(p=>[...p,{r:"user",t:q}]);setAIn("");setTimeout(()=>{let a="收到！讓我查一下...";if(q.includes("營收"))a="📊 本月營收："+fmt(S.orders.filter(o=>o.st==="completed").reduce((s,o)=>s+o.amt,0))+"\n✅ 完成訂單 "+S.orders.filter(o=>o.st==="completed").length+" 筆\n📈 最大客戶：聯電 NT$4.5M";else if(q.includes("庫存")||q.includes("警告"))a="⚠️ 庫存警報：\n"+S.inv.filter(i=>i.st!=="ok").map(i=>`${i.st==="critical"?"🔴":"🟡"} ${i.name} ${i.stock}/${i.reorder}`).join("\n")+"\n\n✅ 已產生補貨建議";else if(q.includes("供應商"))a="🏆 供應商排名：\n"+suppliers.filter(s=>s.grade==="S").map((s,i)=>`${["🥇","🥈","🥉"][i]||"⭐"} ${s.name} 品質${s.quality}%`).join("\n");else a="我可以幫您查詢：\n• 營收/訂單數據\n• 庫存警告\n• 供應商評級\n• 生產進度\n\n請問要查什麼？";setMsgs(p=>[...p,{r:"bot",t:a}]);},400);};

  return<div style={{display:"flex",height:"100vh",background:T.bg,fontFamily:T.f,color:T.t,overflow:"hidden"}}>
    {/* Sidebar */}
    <div style={{width:col?52:200,transition:"width 0.2s",background:"#fff",borderRight:`1px solid ${T.b}`,display:"flex",flexDirection:"column",flexShrink:0,overflow:"hidden"}}>
      <div style={{padding:col?"12px 6px":"12px 14px",borderBottom:`1px solid ${T.bl}`,display:"flex",alignItems:"center",justifyContent:"space-between",minHeight:44}}>
        {!col&&<div style={{fontFamily:T.mo,fontSize:13,fontWeight:800,letterSpacing:"0.06em",whiteSpace:"nowrap"}}>Think <span style={{color:T.r}}>BIG!</span></div>}
        <button onClick={()=>setCol(!col)} style={{background:"none",border:"none",cursor:"pointer",padding:3}}>{$.menu({s:15,c:T.tm})}</button>
      </div>
      <div style={{flex:1,padding:"4px 3px",overflowY:"auto",display:"flex",flexDirection:"column",gap:1}}>
        {nav.map(n=><button key={n.id} onClick={()=>setTab(n.id)} style={{display:"flex",alignItems:"center",gap:8,padding:col?"7px":"7px 9px",borderRadius:6,background:tab===n.id?T.rbg:"transparent",border:tab===n.id?`1px solid ${T.rb}`:"1px solid transparent",color:tab===n.id?T.r:T.ts,cursor:"pointer",width:"100%",justifyContent:col?"center":"flex-start",fontSize:12,fontWeight:tab===n.id?600:400,transition:"all 0.15s"}} onMouseEnter={e=>{if(tab!==n.id)e.currentTarget.style.background="#f4f4f5"}} onMouseLeave={e=>{if(tab!==n.id)e.currentTarget.style.background="transparent"}}>{n.icon({s:15,c:tab===n.id?T.r:T.tm})}{!col&&<span>{n.l}</span>}</button>)}
      </div>
      <div style={{padding:"4px 3px",borderTop:`1px solid ${T.bl}`}}><button onClick={onLogout} style={{display:"flex",alignItems:"center",gap:8,padding:col?"7px":"7px 9px",borderRadius:6,background:"none",border:"none",color:T.tm,cursor:"pointer",width:"100%",justifyContent:col?"center":"flex-start",fontSize:11}}>{$.out({s:14,c:T.tm})}{!col&&"登出"}</button></div>
    </div>

    {/* Main Area */}
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Topbar */}
      <div style={{height:46,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 16px",borderBottom:`1px solid ${T.b}`,background:"#fff",flexShrink:0}}>
        <h2 style={{fontSize:13,fontWeight:600,margin:0}}>{nav.find(n=>n.id===tab)?.l}<span style={{color:T.tm,marginLeft:6,fontSize:10,fontFamily:T.mo,fontWeight:400}}>{nav.find(n=>n.id===tab)?.en}</span></h2>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <div style={{display:"flex",alignItems:"center",gap:4,padding:"4px 8px",background:T.bg,borderRadius:6,border:`1px solid ${T.b}`,width:150}}>{$.srch({s:12,c:T.tm})}<input placeholder="搜尋..." style={{border:"none",background:"none",outline:"none",fontSize:11,width:"100%"}}/></div>
          <span style={{fontSize:10,fontFamily:T.mo,color:T.tm}}>{time.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}</span>
          <button onClick={()=>setAi(!aiOpen)} style={{display:"flex",alignItems:"center",gap:3,padding:"4px 8px",borderRadius:6,background:aiOpen?T.rbg:"#fff",border:`1px solid ${aiOpen?T.rb:T.b}`,color:aiOpen?T.r:T.ts,cursor:"pointer",fontSize:10,fontWeight:600}}>{$.bot({s:12,c:aiOpen?T.r:T.tm})} AI</button>
          <div style={{position:"relative"}}>{$.bell({s:15,c:T.tm})}<div style={{position:"absolute",top:-1,right:-1,width:5,height:5,borderRadius:"50%",background:T.r}}/></div>
        </div>
      </div>

      {/* Content + AI Panel */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        <div style={{flex:1,overflowY:"auto",padding:16}}>{pages[tab]}</div>
        {aiOpen&&<div style={{width:280,borderLeft:`1px solid ${T.b}`,background:"#fff",display:"flex",flexDirection:"column",flexShrink:0}}>
          <div style={{padding:"10px 14px",borderBottom:`1px solid ${T.bl}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:24,height:24,borderRadius:"50%",background:T.r,display:"flex",alignItems:"center",justifyContent:"center"}}>{$.bot({s:12,c:"#fff"})}</div><div><div style={{fontSize:11,fontWeight:600}}>AI 助理</div><div style={{fontSize:8,color:T.g}}>● Online</div></div></div><button onClick={()=>setAi(false)} style={{background:"none",border:"none",cursor:"pointer"}}>{$.x({s:14,c:T.tm})}</button></div>
          <div style={{flex:1,overflowY:"auto",padding:10,display:"flex",flexDirection:"column",gap:6}}>{aiMsgs.map((m,i)=><div key={i} style={{padding:"8px 10px",borderRadius:8,maxWidth:"90%",fontSize:11,lineHeight:1.6,whiteSpace:"pre-wrap",...(m.r==="bot"?{background:T.bg,border:`1px solid ${T.bl}`,alignSelf:"flex-start"}:{background:T.rbg,border:`1px solid ${T.rb}`,alignSelf:"flex-end"})}}>{m.t}</div>)}</div>
          <div style={{padding:"6px 10px",borderTop:`1px solid ${T.bl}`,display:"flex",gap:4}}><input value={aiIn} onChange={e=>setAIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendAi()} placeholder="問我..." style={{flex:1,padding:"6px 8px",background:T.bg,border:`1px solid ${T.b}`,borderRadius:6,fontSize:11,outline:"none"}}/><button onClick={sendAi} style={{background:T.r,border:"none",borderRadius:6,padding:"6px 8px",color:"#fff",cursor:"pointer"}}>{$.send({s:12,c:"#fff"})}</button></div>
        </div>}
      </div>
    </div>

    {/* Toasts */}
    {S.toasts.map(t=><div key={t.id} style={{position:"fixed",top:12,right:12,zIndex:9999,padding:"10px 16px",background:t.type==="success"?T.gbg:t.type==="error"?T.rbg:T.blbg,border:`1px solid ${t.type==="success"?"#86efac":t.type==="error"?T.rb:"#93c5fd"}`,borderRadius:8,color:t.type==="success"?T.g:t.type==="error"?"#ef4444":T.bl2,fontSize:12,fontWeight:600,boxShadow:"0 8px 30px rgba(0,0,0,0.1)",animation:"slideD 0.3s ease"}}>{t.type==="success"?$.chk({s:14,c:T.g}):$.warn({s:14,c:"#ef4444"})} {t.msg}</div>)}

    <style>{`@keyframes spin{to{transform:rotate(360deg)}}@keyframes slideD{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:${T.b};border-radius:2px}::-webkit-scrollbar-track{background:transparent}`}</style>
  </div>;
}

const AppMain = function App(){
  const[in_,setIn]=useState(false);
  return in_?<Dash onLogout={()=>setIn(false)}/>:<Login onLogin={()=>setIn(true)}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(AppMain));
</script>
</body>
</html>
