          - text: ）
        - listitem [ref=e237]:
          - text: —
          - strong [ref=e238]: ChatGPT Agent / dots（OpenAI）
          - text: ：ChatGPT Agent 每月額度（Plus 40 則、Pro 400 則）；額度用完可加購 credits，或等月重置。（查證於 2026-09-30，來源：
          - link "官方說明" [ref=e239] [cursor=pointer]:
            - /url: https://help.openai.com/en/articles/12642688
          - text: ）
        - listitem [ref=e240]:
          - text: —
          - strong [ref=e241]: Grok Bot（xAI）
          - text: ：每週額度池重置；可購買 Extra Usage Credits（US$5 起，效期一年）。（查證於 2026-09-30，來源：
          - link "官方 FAQ" [ref=e242] [cursor=pointer]:
            - /url: https://docs.x.ai/grok/faq
          - text: ）
        - listitem [ref=e243]:
          - text: —
          - strong [ref=e244]: Gemini Spark（Google）
          - text: ：用量依運算量計算，每 5 小時恢復一次，直到每週上限；Pro 與 Ultra 可加購 AI credits。（查證於 2026-09-30，來源：
          - link "官方說明" [ref=e245] [cursor=pointer]:
            - /url: https://blog.google/products-and-platforms/products/google-one/google-ai-subscriptions/
          - text: ）
        - listitem [ref=e246]:
          - text: —
          - strong [ref=e247]: Muse（Meta）
          - text: ：免費額度用完可升級，或等免費額度恢復；Power 每週 5 億 tokens，Maximum 每週 30 億 tokens。（查證於 2026-09-30，來源：
          - link "官方說明" [ref=e248] [cursor=pointer]:
