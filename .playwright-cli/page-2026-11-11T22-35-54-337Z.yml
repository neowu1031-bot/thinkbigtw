      - heading "常見問題" [level=2] [ref=e299]
      - generic [ref=e300]:
        - generic [ref=e301]: Q：2026 年常見的 AI Agent 有哪些？
        - paragraph [ref=e302]: 分成兩類：大模型品牌推出、以訂閱方案使用的 AI Agent；以及開源、可自選模型的 AI Agent（如龍蝦）。各家介紹見本頁「2026 年常見的 AI Agent 有哪些」。
      - generic [ref=e303]:
        - generic [ref=e304]: Q：新的 AI Agent 出來了，還需要龍蝦（OpenClaw）嗎？
        - paragraph [ref=e305]: 兩者擅長的工作不同，可以一起用。2026 年常見的大模型品牌 AI Agent 包括：Grok Bot（xAI）、Claude（Anthropic）、ChatGPT Agent 與 dots（OpenAI）、Gemini Spark（Google）、Muse（Meta）、Copilot Autopilot（Microsoft）、Manus 等。每一個都很好，但如果要長時間運作、又想費用可控，大模型品牌推出的 AI Agent 就不會是首選，但很適合拿來協作。龍蝦（OpenClaw）等開源 AI Agent 可自選模型、依用量付費、24 小時常駐，適合長時間例行運作情境。
      - generic [ref=e306]:
        - generic [ref=e307]: Q：龍蝦 AI 是什麼？要錢嗎？
        - paragraph [ref=e308]:
          - text: 龍蝦是台灣使用者對開源 AI Agent 的暱稱。軟體本身開源免費；使用時要付 AI 模型用量費，依用量計算，由使用者直接付給模型商；找人安裝另外收服務費。→
          - link "龍蝦代裝服務說明" [ref=e309] [cursor=pointer]:
