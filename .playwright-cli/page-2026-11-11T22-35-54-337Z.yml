      - separator [ref=e40]
      - heading "一句話結論" [level=2] [ref=e41]
      - generic [ref=e42]: 每一個都很好。但如果要長時間運作、又想費用可控，大模型品牌推出的 AI Agent 就不會是首選，但很適合拿來協作。
      - list [ref=e43]:
        - listitem [ref=e44]:
          - text: —
          - strong [ref=e45]: 費用結構不同
          - text: ：訂閱型 AI Agent 費用固定含額度，額度用完就停；開源 AI Agent 依實際用量付費，可以預算導向地控制。
        - listitem [ref=e46]:
          - text: —
          - strong [ref=e47]: 適合的工作不同
          - text: ：訂閱型適合短時間協作、需要品牌生態（Gmail、Teams、WhatsApp）串接的任務；開源型適合 24 小時常駐、例行流程、費用可控的工作。
        - listitem [ref=e48]:
          - text: —
          - strong [ref=e49]: 可以一起用
          - text: ：常見做法是讓龍蝦（OpenClaw）或 Hermes 跑長時間例行任務，品牌 AI Agent 用來協作或做需要特定生態的任務。
      - heading "先說清楚：AI Agent 是什麼" [level=2] [ref=e50]
      - paragraph [ref=e51]:
        - text: AI Agent 是依核准的資料、工具與操作範圍執行工作流程的 AI 助理；產物與重要操作仍需指定人員覆核。（
        - link "完整術語表" [ref=e52] [cursor=pointer]:
          - /url: /guides/glossary/
        - text: ）
      - paragraph [ref=e53]: 換句話說，AI Agent 不只是聊天機器人——它可以自己開瀏覽器、操作 App、在背景持續工作、依照排程執行任務。但「能不能幫你做事」，取決於它被賦予的工具範圍、模型能力，以及你的設定。
      - heading "2026 年常見的 AI Agent 有哪些" [level=2] [ref=e54]
      - generic [ref=e55]: 資料查證日期：2026-09-30，價格以各家官網為準。原幣價格不自行換算台幣；需換算時已附換算基準。標記說明：【官方】來自品牌官網或官方部落格；【第三方】只有媒體資料；【待實測】官方未揭露。
      - heading "兩大類型" [level=3] [ref=e56]
      - paragraph [ref=e57]: 目前市面上的 AI Agent 可分成兩類：
      - list [ref=e58]:
        - listitem [ref=e59]:
          - text: —
          - strong [ref=e60]: 大模型品牌推出的 AI Agent
          - text: ：以訂閱方案使用，費用固定，額度用完需等重置或加購。例如 Claude、ChatGPT Agent、Gemini Spark、Grok Bot、Muse。
        - listitem [ref=e61]:
          - text: —
          - strong [ref=e62]: 開源 AI Agent（可自選模型）
          - text: ：軟體開源免費，模型費用依實際用量付給自選的模型商，或接本地大模型零模型費。例如 OpenClaw（龍蝦）、Hermes。
      - paragraph [ref=e63]: 以下依推出者英文字母排序，各家各一段條列介紹：
      - generic [ref=e64]:
        - heading "Claude（Anthropic）" [level=3] [ref=e65]
        - list [ref=e66]:
          - listitem [ref=e67]:
            - text: —
            - strong [ref=e68]: 是什麼
            - text: ：Claude 是 Anthropic 的 AI 助理，2026 年 9 月起整合原 Cowork 功能，可在關閉電腦後繼續背景完成報告、簡報、研究任務。【官方】
          - listitem [ref=e69]:
            - text: —
            - strong [ref=e70]: 怎麼用
            - text: ：網頁版、桌面版、App、Claude Code（程式碼助理）；網頁、App、Claude Code 共用同一個用量上限。【官方】
          - listitem [ref=e71]:
            - text: —
            - strong [ref=e72]: 怎麼計費
            - text: ：Free（有限制）；Pro US$20／月（年繳每月 US$17）；Max US$100 起（約 Pro 5 倍用量）。【官方】額度分 5 小時區段上限與每週上限；用完可購買 usage credits。
          - listitem [ref=e73]:
            - text: —
            - strong [ref=e74]: 台灣可用
            - text: ：可以（台灣在支援國家名單內）。【官方】
          - listitem [ref=e75]:
            - text: —
            - strong [ref=e76]: 出處
            - text: ：
            - link "claude.com/pricing" [ref=e77] [cursor=pointer]:
              - /url: https://claude.com/pricing
            - text: 、
            - link "用量上限說明" [ref=e78] [cursor=pointer]:
              - /url: https://support.claude.com/en/articles/11647753-how-do-usage-and-length-limits-work
            - text: ，查證於 2026-09-30。
      - generic [ref=e79]:
        - heading "ChatGPT Agent 與 dots（OpenAI）" [level=3] [ref=e80]
        - list [ref=e81]:
          - listitem [ref=e82]:
            - text: —
            - strong [ref=e83]: 是什麼
            - text: ：ChatGPT Agent 是 OpenAI 整合進 ChatGPT 的 agent 模式，用虛擬瀏覽器與連接的 App 完成多步驟任務；dots（2026 年 9 月 29 日推出）是 24 小時常駐的 AI Agent，有自己的雲端電腦，可串接超過 4,000 個 App。【官方】
          - listitem [ref=e84]:
            - text: —
            - strong [ref=e85]: 怎麼用
            - text: ：ChatGPT 工具選單選「agent」或輸入 /agent 啟用；dots 可在 ChatGPT、Slack、Teams 裡傳訊息使用。【官方】
          - listitem [ref=e86]:
            - text: —
