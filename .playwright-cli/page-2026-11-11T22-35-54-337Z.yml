      - generic [ref=e313]:
        - generic [ref=e314]: Q：想讓 AI Agent 長時間運作，費用怎麼控制？
        - paragraph [ref=e315]: 選能自己換模型、依用量付費的做法，並設定用量上限；需要協作的時段再搭配訂閱型 AI Agent。龍蝦等開源 AI Agent 都支援自選模型。
