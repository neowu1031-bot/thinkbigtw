            - text: ：ChatGPT Agent 模式：Plus US$20（約 640 TWD，1 USD=31.9，2026-09-30 台銀牌告）每月 40 則；Pro US$100 起每月 400 則。【官方】ChatGPT Agent 與 Codex、Work 共用 agentic 額度，額度用完可加購 credits。dots 第一個內含在 Pro 與 Business Premium 方案裡，不另收費；和 dots 對話不算 ChatGPT 額度。【官方】
          - listitem [ref=e88]:
            - text: —
            - strong [ref=e89]: 台灣可用
            - text: ：ChatGPT Agent 可以（台灣在支援名單內）；dots 官方未列排除名單，台灣可否開通【待實測】。【官方】
          - listitem [ref=e90]:
